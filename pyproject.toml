[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-rag"
version = "0.1.0"
description = "Paired-data comparison of structured-FHIR RAG vs. LLM-narrative RAG on specialty-medication QA."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Tirthesh Jani" }]

dependencies = [
  "fhir.resources>=8.0,<9.0",
  "groq>=0.11.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "pydantic>=2.6,<3.0",
  "python-dateutil>=2.8.2",
  "jsonschema>=4.21",
  "tqdm>=4.66",
  "jinja2>=3.1",
  "numpy>=1.26,<3.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["overlay/tests", "systems/tests", "questions", "narratives"]
python_files = ["test_*.py"]
